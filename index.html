<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern dictionary web app powered by the Free Dictionary API.">
    <meta name="color-scheme" content="dark">

    <title>Lexicon - Dictionary App</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
</head>

<body>

    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>
    </div>

    <div class="app-wrapper">

        <header class="app-header">
            <div class="logo">
                <span class="logo__icon" aria-hidden="true">📖</span>
                <span class="logo__text">Lexicon</span>
            </div>

            <p class="tagline">Your intelligent English dictionary</p>
        </header>

        <section class="search-section" aria-label="Word search">
            <div class="search-card glass">

                <div class="search-bar" role="search">
                    <label for="search-input" class="visually-hidden">
                        Search for a word
                    </label>

                    <input
                        id="search-input"
                        class="search-input"
                        type="search"
                        placeholder="Search for a word..."
                        autocomplete="off"
                        spellcheck="false"
                        aria-describedby="search-hint"
                        maxlength="60"
                    >

                    <button
                        id="search-btn"
                        class="search-btn"
                        aria-label="Search"
                        title="Search"
                    >
                        <svg
                            class="search-icon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>

                <p id="search-hint" class="search-hint">
                    Press Enter or click the button to search
                </p>

            </div>
        </section>

        <div
            id="loading-state"
            class="state-display"
            hidden
            aria-live="polite"
            aria-label="Loading"
        >
            <div class="loader" aria-hidden="true">
                <div class="loader__ring"></div>
                <div class="loader__ring"></div>
                <div class="loader__ring"></div>
            </div>

            <p class="state-text">Looking up the word...</p>
        </div>

        <div
            id="error-state"
            class="state-display"
            hidden
            aria-live="assertive"
            role="alert"
        >
            <div id="error-icon" class="error-icon" aria-hidden="true">
                🔍
            </div>

            <h2 id="error-title" class="error-title">
                Word Not Found
            </h2>

            <p id="error-message" class="error-message"></p>

            <p id="error-tip" class="error-tip">
                Try checking the spelling or search a different word.
            </p>
        </div>

        <section
            id="result-section"
            class="result-section"
            hidden
            aria-label="Dictionary result"
        >

            <div class="word-header glass">
                <div class="word-header__info">
                    <h1 id="result-word" class="result-word"></h1>
                    <p id="result-phonetic" class="result-phonetic"></p>
                </div>

                <button
                    id="audio-btn"
                    class="audio-btn"
                    aria-label="Play pronunciation"
                    title="Play pronunciation"
                    hidden
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
                    </svg>
                </button>
            </div>

            <div id="meanings-container" class="meanings-container"></div>

            <div id="relations-container" class="relations-container"></div>

        </section>

        <section
            id="history-section"
            class="history-section"
            aria-label="Search history"
            hidden
        >
            <div class="history-header">

                <h2 class="history-title">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        width="18"
                        height="18"
                    >
                        <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"></path>
                    </svg>

                    Recent Searches
                </h2>

                <button
                    id="clear-history-btn"
                    class="clear-history-btn"
                    aria-label="Clear all search history"
                >
                    Clear All
                </button>

            </div>

            <ul
                id="history-list"
                class="history-list"
                role="list"
                aria-label="Search history items"
            ></ul>
        </section>

        <footer class="app-footer">
            <p>
                Powered by
                <a
                    href="https://en.wiktionary.org/"
                    target="_blank"
                    rel="noopener noreferrer"
                >Wiktionary</a>
                and
                <a
                    href="https://www.datamuse.com/api/"
                    target="_blank"
                    rel="noopener noreferrer"
                >Datamuse</a>
            </p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
